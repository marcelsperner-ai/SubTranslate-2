doppelhaushälfte:
  "1x01": "Bei der Besichtigung einer Doppelhaushälfte im Grünen müssen Theo und Mari einiges tun, um sich gegen ein konkurrierendes weißes Paar durchzusetzen. Mari fühlt sich aufgrund ihrer Herkunft vom Makler diskriminiert, Theo versucht diesen mit schnell besorgtem Bier zu beeindrucken. Durch eine günstige Fügung bekommen sie den Zuschlag, müssen aber feststellen, dass der angebliche Makler ihr zukünftiger Nachbar sein wird."
  "1x02": "Rocco wird von älteren Jungs verprügelt, weswegen Andi ihn in Selbstverteidigung trainiert. Mari verkennt dies als Misshandlung und meldet es der Polizei. Als sie den Irrtum erkennt, soll ein gemeinsames Grillen die Wogen glätten. Als Theo und Rocco dafür einkaufen, treffen sie die Jugendlichen, die sich über die beiden lustig machen. Theo verprügelt die Jungs, sodass die Polizei wenig später erneut anrücken muss."
  "1x03": "Als Mari mit Zoe zu einer Hochzeit aufbricht, sagen Theos Freunde die geplante Jamsession krankheitsbedingt ab. Er findet im Garten Gras, das Zoe zuvor im Tauschgeschäft von Rocco erhalten hat. Als Tracy Theo beim Kiffen erwischt und bemerkt, dass es ihr Gras ist, rauchen sie gemeinsam und landen vollgedröhnt im Keller. Theo löst den stillen Alarm der Knuppes aus und Andi eilt von seinem Canasta-Abend herbei. Als unerwartet auch noch Mari und Zoe dazustoßen, ist das Chaos perfekt."
  "1x04": "Maris schwuler Bruder Brian offenbart, dass er zur Bundeswehr gehen wird. Mari schlägt ihm kurzerhand ein Kunststudium vor und tatsächlich beginnt er am nächsten Morgen zu malen. Als Model hat er sich Nachbar Andi auserkoren, worauf Theo neidisch ist. Zoe gibt über ihren Social-Media-Kanal Schminktipps – Follower Rocco freut es; Mari findet das Make-up völlig übertrieben. Als Tracy dies mitbekommt, lockt sie Zoe in ihren Beautysalon und schminkt sie professionell."
  "1x05": "Theo hat zum Fußballschauen im Garten Freunde eingeladen, Mari ihre Bekannte Comfort und deren Freund Tobi, einen weißen Afrikakenner mit Dreadlocks, der andere gern über Rassismus belehrt. Knuppes stoßen dazu und Tracy versteht sich gleich prächtig mit Comfort. Andi stellt fest, dass außer ihm nur Tobi weiß ist. Dieser interpretiert Andis Zuzwinkern als rassistischen Angriff. Die Stimmung kippt."
  "1x06": "Mari stalkt Zoes unliebsamen Freund über Social-Media, während Theo dem Gestöhne der Knuppes durch die Wand lauscht. Mari steckt Andi, dass man sie beim Sex höre, sodass Andi krampfhaft versucht, die Geräusche zu reduzieren. Mit einer von Andis gekauften Überwachungskameras bastelt Rocco eine filmende Drohne, die zu Theo und Mari hinüberfliegt, als diese sich gerade auf dem Wohnzimmertisch verlustieren. Doch auch Andi und Tracy sind näher, als die beiden ahnen."
  "1x07": "Nachdem Andi Zoe angezeigt hat, weil sie Rocco hat Knabberzeugs kauen lassen und die Geräusche gestreamt hat, müssen die Familien ein Gespräch mit einer Mediatorin führen. Es stellt sich heraus, dass die Kinder damit fast 10.000 Euro verdient haben, worauf Knuppes Schmerzensgeld einfordern. Die Mediatorin schlägt ein Gespräch vor, in dem alle die Rollen tauschen. Es geht zunächst heiß her, doch Tracy schlägt vor, die Anzeige zurückzuziehen, wenn sie an den Einnahmen beteiligt werden."
  "1x08": "Mari hat ein Dorffest der kulturellen Vielfalt initiiert und Andi dafür das Gelände des Fußballvereins Germania Schönefelde klargemacht. Andis Polizeikumpel warnen, dass der Verein dies missbillige und alles abgesagt werden müsse, was Andi unbedingt verhindern möchte. Schließlich erscheint eine Gruppe von Vereinsmitgliedern und zettelt eine Schlägerei an, an deren Ende Mari Theo ihre Schwangerschaft mitteilt. Zum Schluss feiert die lädierte Dorfgemeinschaft in kleiner Runde."
  "2x01": "Da Mari wieder arbeiten geht, kümmert sich Theo um die kleine Frida. Andi organisiert für Rocco einen Praktikumsplatz in Maris Firma und hilft dem überforderten Theo mit Frida. Damit Rocco Verantwortung lernt, kauft ihm Tracy einen Hamster, den sie jedoch aus verschiedenen Gründen mehrmals ersetzen muss. Als Mari unerwartet früh von der Arbeit kommt, bekommt sie mit, dass Andi sich um Frida kümmert. Diese produziert dann auch ihr erstes Wort: „Andi“."
  "2x02": "Andi hat im Golfclub Hausverbot. Um beim Turnier dennoch den Preis inklusive Mitgliedschaft zu erobern, meldet er Rocco unter falschem Namen an. Doch auch Gattin Tracy tritt an. Rocco erhält Tipps von Theo, der früher einmal ein großes Golftalent war, bis ihm die Nerven durchgingen. Zoe hingegen protestiert mit Freundin Charlotte gegen die Golfplatzerweiterung. Mari unterstützt die Teenager, doch ihre Methoden werden den beiden schließlich zu radikal."
  "2x03": "Andi trifft im Supermarkt Manni, Tracys erste Liebe und Selfmademan. Durch ihn erfährt Andi, dass er eine wertvolle Versicherungspolice besitzt. Er macht sich im Haus sofort auf die Suche und spannt dafür auch Theo ein. Manni versucht wieder bei Tracy zu landen, während Mari Zoe in ihrem Liebeskummer trösten möchte und Rocco den guten Zuhörer gibt. Als sich zum Schluss alle im Keller streiten, findet Rocco von den anderen unbemerkt die Police und isst sie."
  "2x04": "Theo und Mari wollen endlich mal wieder ausgehen und geben Zoe und Charlotte letzte Anweisungen fürs Babysitten von Frida. Noch ahnen sie nicht, dass Knuppes im gleichen Hotel sind und beide Paare notgedrungen den Tisch teilen müssen. Alle Bemühungen Maris, dies zu ändern, schlagen fehl. Zuhause beauftragen die beiden Mädchen Rocco, Alkohol mitzubringen. Dieser kümmert sich auch um Frida und imponiert Charlotte. Schließlich spielen sie Flaschendrehen."
  "2x05": "Bei Knuppes bricht eine Kakerlakeninvasion aus und sie müssen während der Bekämpfung im Vorgarten zelten. Mari erträgt das nicht und sie überzeugt Theo und Zoe, sie bei sich aufzunehmen. Bald treten Meinungsverschiedenheiten zutage: übers Fernsehen, Ordnung und Familienmodelle. Jetzt versucht Mari, sie wieder loszuwerden, eine Aussprache der Familien eskaliert. Als Knuppes wieder in ihre Hälfte können, kommt es bei Sawadi-Kröger zur Kakerlakeninvasion."
  "2x06": "Maris Bruder Brian lädt die Familien zu seiner Vernissage ins Metaverse ein; jeder betritt als Avatar die virtuelle Welt. Andi missfällt, dass er auf den Bildern als Affe abgebildet ist, woraufhin er sich beim Impressum beschweren möchte. Tracy stiehlt eines der Bilder und Mari nimmt die Verfolgung auf. Rocco kann in der Anonymität der Welt besser mit Zoe kommunizieren, während Theo sich mit zunehmender Dauer zum Propheten einer wachsenden virtuelle Bewegung entwickelt."
  "2x07": "Theo hat seit Wochen auf einen Werwolf-Spieleabend hingearbeitet. Als Gäste absagen, werden Knuppes als Ersatz eingeladen, die gerade Tracys Mutter zu Besuch haben. Statt zu spielen, wird viel diskutiert bzw. miteinander gestritten, sodass Theo resigniert. Schließlich kommt die Polizei wegen einer anonymen Ruhestörungsmeldung und die Gruppe fragt sich, ob einer von ihnen diese gerufen habe. Die Polizeianwärterin fordert daraufhin alle auf, gemeinsam das Spiel zu beginnen."
  "2x08": "Die Gruppe begibt sich in Theos ausgeschmückte Kulisse. Unter seiner Spielleitung versuchen die Mitspieler herauszufinden, wer von ihnen die beiden Werwölfe sein könnten. Es wird kombiniert und verdächtigt; Konflikte werden ausgetragen, die Stimmung wird gereizter. Nachdem sich die Gruppe Runde für Runde immer mehr dezimiert, müssen die Verbliebenen mit ihrer letzten Wahl über den Ausgang des Spiels entscheiden."
tatortreiniger:
  "1x01": "Auf den Tatortreiniger trifft eine Prostituierte, die von dem Toten vor seinem Tod beauftragt wurde und nichtsahnend an den Tatort gerät. Es entwickelt sich ein Gespräch über Berufsethiken und Berufspraxen. Die beiden begegnen einander auf professioneller Ebene."
  "1x02": "Der Tatortreiniger ist im Haus eines Schriftstellers tätig, der sich zunächst von Schottys Anwesenheit gestört fühlt, dann aber letztlich künstlerisch davon profitiert."
  "1x03": "Der Tatortreiniger ist im Haus einer alten Frau tätig, die von ihrer Überlegenheit und ihren gesellschaftlichen Privilegien sehr überzeugt ist. Immer mehr gewinnt Schotty den Eindruck, dass der Einbrecher in der Villa nicht einfach nur gestürzt ist, sondern dass die alte Dame mit dem Golfschläger nachgeholfen hat. Als er ankündigt, die Polizei rufen zu wollen, gerät er in einen Gewissenskonflikt, denn für sein Schweigen würde Frau Hellenkamp ihn mit einem Maserati Quattroporte IV belohnen."
  "1x04": "Der Tatortreiniger ist im Haus eines Psychotherapeuten tätig, der ihm als Geist erscheint und mit ihm ein therapeutisches Gespräch unter Anwendung verschiedener Therapiestrategien führt. Durch den zufälligen Besuch einer der Klientinnen des Therapeuten wird Schotty mit seinen Klischees über Frauen konfrontiert."
  "2x01": "Der Tatortreiniger ist an seinem Arbeitsplatz mit dem Täter und mit seinem eigenen Nikotinentzug konfrontiert."
  "2x02": "Am Arbeitsplatz des Tatortreinigers taucht die Exfreundin des Toten auf, ein D-Promi, die sich mit einem Fernsehinterview am Tatort promoten will."
  "2x03": "Schotty gerät an einen Tatort, der mit Nazi-Devotionalien angefüllt ist, und an dem er sich mit einem wortreichen Vertreter des „modernen Nationalsozialismus“ konfrontiert sieht. Der Tatortreiniger findet eine Lösung, mit diesen Sachverhalten umzugehen."
  "2x04": "Schotty soll das Atelier eines verstorbenen Zauberers reinigen, gerät dabei an dessen Exfreund und wird mit seinen Vorurteilen gegenüber Schwulen konfrontiert."
  "2x05": "Schotty soll ein verfallenes altes Haus von den Resten eines verstorbenen Obdachlosen reinigen. Zufällig ist dort gleichzeitig ein Schamane tätig. Die beiden erörtern ihre weltanschaulichen Differenzen, finden aber einen gemeinsamen Nenner."
  "7x01": "Schotty wird in eine Kunstgalerie gerufen, in der ein verkannter Maler einen Unfall hatte. Er bekommt einen Einblick in die Welt der Kunst, des Geldes und der Wertigkeit der Dinge. Daraufhin geht er eine Currywurst essen und wird bei seiner Rückkehr in einen Kunstbetrug verstrickt, da er sein Mittagessen versehentlich mit einem Teil eines Kunstwerks bezahlt hat."
  "7x02": "Schotty wird bei der Arbeit von seinen Freunden Didi, Frido und El Blondo besucht. El Blondo wartet im Auto, da die Freunde eigentlich schnell weiterziehen wollten, doch Frido muss ständig auf die Toilette. Während man wartet, entspinnt sich zwischen Schotty und Didi eine Unterhaltung über Filzgleiter. El Blondo versucht inzwischen das Auto zu verlassen, scheitert aber am Sicherheitsgurt. Die angeregte Diskussion gleitet nach dem Auftauchen von Frido in ein skurriles Streitgespräch ab. Am Rande geht es beispielsweise auch um Matratzenwenderinnenfutter oder Warentrennerthermometer. Didi zitiert schließlich einen seiner ersten lyrischen Ergüsse. Allmählich kehrt das Gespräch wieder zum Filzgleiter zurück und ein kleiner, schnörkelloser, spanischer Song entsteht. Ob El Blondo sich zwischenzeitlich im Auto selbst stranguliert hat, bleibt unklar."
  "7x03": "Schotty unterhält sich in einer Arbeitspause mit einem anwesenden Wachkomapatienten. Bei dem Versuch Mario Götzes WM-Finaltreffer nachzustellen, fällt er hin, schlägt mit dem Kopf auf und befindet sich dann im Gehirn des Komapatienten. Schotty gewinnt einen völlig neuen Blick auf das menschliche Dasein."
  "7x04": "Am Empfang eines Unternehmens scheint man durch Schottys Auftauchen extrem überfordert. Nach seltsamen Begegnungen mit Freunden, Bekannten und Weggefährten gerät Schottys Realität einmal mehr ins Wanken. Der „Tatort“, zu dem er gerufen wurde, stellt sich als sein eigenes Ende heraus."
schuld:
  "1x01": "Das kinderlose Ehepaar Thorsten und Lizzy Paulsberg aus der oberen Mittelschicht frischt sein Liebesleben nach über zehn Jahren Ehe damit auf, dass Thorsten Lizzy dabei filmt, wie sie mit anderen Männern schläft. Beide kamen auf den Geschmack durch einen „Dreier“, der sich zufällig bei einem gemeinsamen Wochenende in einem Wellness-Hotel ergab. Thorsten ist sowohl erregt als auch eifersüchtig, beide genießen den gemeinsamen Sex mehr nach den Dreier-Sessions in Hotels, bei denen Thorsten filmt. Eines Tages lernen sie über eine entsprechende Dating-Website einen ehemaligen Schulkameraden von Thorsten kennen, den lebenshungrigen Rüdiger Timmer. Lizzy will abbrechen, aber Thorsten schafft es nicht „nein“ zu sagen. Die Spannung ist zu groß, beide beenden das Spiel. Irgendwann später trifft Rüdiger Thorsten zufällig während einer Messe im Hotel, will spontan mit ihm feiern und bringt uneingeladen Drogen auf Thorstens Zimmer. Bei Thorsten explodiert die stille Eifersucht von damals, und er verletzt Rüdiger lebensgefährlich. Nur weil er bei der Abreise an der Rezeption auf einer „schnellen Reinigung des Zimmers“ besteht, überlebt Rüdiger. Thorsten wird verhaftet, seine Frau engagiert Kronberg. Thorsten will keine Aussage machen, er will seine Frau decken, ihr die Scham und beruflichen Ärger ersparen, wenn die Sexspiele öffentlich werden würden. Er wird zu 3,5 Jahren wegen gefährlicher Körperverletzung verurteilt, die Anklage wegen versuchten Totschlages wird fallengelassen. Nach dem Ende der Haft reist das Ehepaar glücklich ins Ausland."
  "1x02": "Der 72-jährige Sozialhilfeempfänger Karl-Heinz Gronau sitzt in seiner Wohnung, als ein Überfallkommando der Polizei hereinstürmt. Er wird brutal festgenommen, es wird ein Messer bei ihm sichergestellt und in der Wohnung 200 Gramm Heroin gefunden. Er schweigt. Der Haftprüfungsrichter Lamprecht bittet Kronberg die Pflichtverteidigung zu übernehmen, denn der Mann sei mittellos. Der Alte schweigt auch gegenüber ihm. Es kommt ihn eine junge schwangere Frau besuchen. Sie flüstert ihm ins Ohr, dass sie von Hassan komme. Gronau drohen, wenn er weiter schweigt, fünf Jahre Haft, weil er dann wegen Drogenhandels mit Waffenbesitz verurteilt wird. Es stellt sich heraus, dass die junge Frau, Jana, die Freundin des Drogenhändlers Hassan ist. Sie denkt, dass Hassan sie und das bald Geborene verlassen werde, weil er zu seiner Familie in den Libanon gehen werde. In einer Rückblende in die 70er wird dem damaligen Gronau klar, dass seine Ehefrau ihn betrügt. Er beschließt daraufhin, sie direkt zu verlassen. Sein Leben bricht an diesem Punkt zusammen. Trotz der Bemühungen von Kronberg und der Richterin schweigt Gronau weiter. „Es gibt Wichtigeres als meine Freiheit“, sagt er im Gerichtssaal. Kurz bevor der Richterin keine Wahl bleibt, ihn zu verurteilen, bringt Kronberg an, dass das Messer in keinerlei Bezug zu den Drogen stand, sondern Gronau wegen seiner fehlenden Zähne darauf angewiesen ist, sein Essen klein zu schneiden. Gronau wird freigesprochen. Hassan wird beim Geldeintreiben verhaftet, Jana bricht mit dem Baby in ihre alte Heimat Polen auf, aber nicht ohne vorher Gronau in einer Zahnklinik anonym eine Zahnbehandlung zu bezahlen. Ihr neugeborener Sohn heißt Malek."
  "1x03": "Häusliche Gewalt über Jahre prägt die Ehe von Alexandra und Thomas Läufer. Kurz nachdem sie sich kennengelernt und geheiratet hatten, offenbarte sich Thomas Läufer als massiv gewalttätig. Alexandra wurde schwanger und schaffte es über Jahre nicht von ihrem Mann loszukommen. Die Gewalt und die dadurch bedingten Traumata gaben ihr keine Chance. Eines Tages, nachdem die neunjährige Tochter Saskia zu den Großeltern gebracht wurde, misshandelt und vergewaltigt Läufer seine Frau. In der darauffolgenden Nacht erschlägt sie ihn im Schlaf mit einer Statue. Kronberg übernimmt den Fall, der in Oldenburg verhandelt wird, wo die Läufers wohnen. Alexandra Läufer verweigert durchgehend die Aussage. Kronberg lässt die aktuellen und früheren Misshandlungen untersuchen und bereitet so seine Verteidigung vor. Der Staatsanwalt sieht wegen der Ermordung im Schlaf das Mordmerkmal der Heimtücke als gegeben an. Kronberg allerdings gelingt es, in seinem Plädoyer aufgrund der permanenten Gefahr durch den Ehemann, der laut Alexandra Läufer am Tattag ankündigte auch demnächst die Tochter zu misshandeln und zu vergewaltigen, die Tat als Notwehr darzustellen. Der Richter folgt der Einschätzung Kronbergs und spricht Alexandra Läufer frei. Vor dem Gericht warten nicht nur die Großeltern, sondern auch der Liebhaber von Alexandra, ein Nachbar, der über den Läufers wohnte und, dies wird Kronberg dann klar, der aufgrund der Schwere der Statue der wahrscheinlichere Täter war. Alexandra und ihr Liebhaber fahren davon."
  "1x04": "Eine Gruppe von Jugendlichen in einem Internat denkt sich immer neue Methoden aus, um einen Außenseiter zu traktieren, der eigentlich nur eins will, dazuzugehören. Der Junge, ein künstlerisches Genie, ist bereit, dafür auch Grenzen zu überschreiten. Im Rahmen eines mysteriösen Rituals kommt er beinahe ums Leben. Seine Kunstlehrerin rettet ihn unter schicksalhaften Umständen – womit ihm gleichzeitig die letzte Lebenshoffnung genommen zu sein scheint."
  "1x05": "Ein junges Obdachlosen-Pärchen, Thomas und Nina, wird 1997 in Berlin spontan von einem Rentner an Heiligabend in seine Wohnung eingeladen. Obwohl der alte Mann behauptet hatte, er wolle keinen Sex, sondern sei einfach nur einsam, erwischt ihn Nina, wie er neben ihr im Badezimmer masturbiert. In Panik ertränkt das Pärchen den Rentner in seiner Badewanne. Es findet eine größere Menge Bargeld, verwischt alle Spuren sorgfältig, wird aber beim Verlassen der Wohnung beobachtet und kurz darauf festgenommen. Da die Polizei ihnen nichts nachweisen kann, werden sie wieder freigelassen. Durch das gefundene Geld ändert sich das Leben der Obdachlosen radikal. Sie mieten eine Wohnung an, finden Arbeit, werden Eltern und leben ein unauffälliges bürgerliches Leben. Fünfzehn Jahre später müssen sie wieder zur Polizei. Die hatte damals zwei Zigaretten-Stummel in der Wohnung asserviert und kann erst heute die gefundene DNA eindeutig Thomas und Nina zuordnen. Beide gestehen nun die Tat. Obwohl sogar die Untersuchungshaft aufgehoben wird, befürchten beide, aufgrund unbedachter Äußerungen ihrer Anwälte, dass sie für mindestens acht Jahre ins Gefängnis müssen und somit die Entwicklung ihrer Kinder nicht erleben. Tatsächlich rechnen Kronberg und sein Kollege mit einer sehr milden Strafe im offenen Vollzug. Die Episode endet mit dem Bild von Thomas und Nina, die sich an einem See selbst umgebracht haben."
  "1x06": "Kronbergs erster Fall: Auf einem Volksfest in einer niedersächsischen Kleinstadt spielt eine Blaskapelle. Die Männer haben ihre Gesichter weiß geschminkt, sich schwarze Bärte aufgemalt und Piraten-Kopftücher aufgezogen. Es sind ordentliche Familienväter mit ordentlichen Berufen: Versicherungsvertreter, Handwerker usw. In der Pause wollen sie hinter dem Bühnenvorhang Bier trinken. Eine siebzehnjährige Bedienung bringt ihnen die Getränke, stolpert aber und fällt hin, wobei sie sich an den zerbrochenen Gläsern die Arme aufschneidet. Blutüberströmt steht sie auf, und weil sie keinen Büstenhalter trägt, zeichnen sich ihre Brüste ab. Die Männer nähern sich ihr und umringen sie. Ein anonymer Anrufer alarmiert von einer Telefonzelle aus die Polizei und meldet eine Vergewaltigung. Die Beamten finden die Siebzehnjährige nackt und schwer verletzt vor. Man hat ihr zwei Rippen, die Nase und den linken Arm gebrochen. Als die Männer fertig gewesen waren, hatten sie ein Brett angehoben und sie unter die Bühne geworfen. Die Polizei stellt zwar die Kleidung des Mädchens sicher, packt sie in einen Plastiksack und legt diesen in den Streifenwagen, aber als das Auto stundenlang in der Sonne steht, werden die Asservate für eine DNA-Analyse unbrauchbar. Und die Ärzte im Krankenhaus wischen nicht nur die Haut der Vergewaltigten ab, sondern beseitigen auch die Spuren in ihren Körperöffnungen. Aufgrund der geschminkten Gesichter ist das Opfer nicht in der Lage, die Männer zu identifizieren, die über sie hergefallen waren. Zumindest einer von ihnen ist unschuldig, denn er rief die Polizei, während die Siebzehnjährige vergewaltigt wurde. Aber er gibt sich nicht zu erkennen. Dem Untersuchungsrichter bleibt nichts anderes übrig, als alle Beschuldigten freizulassen. Es kommt zu keiner Anklage. Kronberg, der einen der Beschuldigten vertreten hat, empfindet, dass er dadurch seine „Unschuld“ verloren hat und „erwachsen“ geworden ist."
  "2x01": "Die Grundschullehrerin Miriam Holbrecht hat eine einmalige sexuelle Begegnung mit dem Vater von Helena, einer ihrer Schülerinnen. Kurz zuvor hatte dieser sich von seiner Frau getrennt. Die 9-jährige Helena, die sehr unter der Trennung ihrer Eltern leidet, beobachtet die beiden und hofft, dass Frau Holbrecht ihre „neue Mutter“ wird. Da es aber in Frau Holbrechts Leben einen anderen Mann gibt, beschuldigt Helena diesen, sie über Monate hinweg sexuell missbraucht zu haben, um ihn aus dem Weg zu räumen. Sie stiftet auch eine Klassenkameradin an, ihre Behauptung durch eine Falschaussage zu stützen. Obwohl Herr Holbrecht seine Unschuld beteuert, wird er zu 42 Monaten (3,5 Jahren) Haft verurteilt. Seine Frau trennt sich während der Haftzeit von ihm. Die Jahre im Gefängnis sind hart für Holbrecht, denn Kinderschänder haben dort einen schweren Stand. Jahre nach seiner Freilassung sieht er Helena zufällig mehrfach wieder. Statt seinem ersten Impuls folgend Rache an ihr zu üben – er hat bereits ein Messer in der Hand – bittet er Kronberg um Hilfe. Dieser redet der jungen Frau ins Gewissen und erreicht ein Wiederaufnahmeverfahren. In diesem gibt Helena zu, damals gelogen zu haben, woraufhin Holbrecht freigesprochen und für die erlittene Haft entschädigt wird."
  "2x02": "Für einen kurzen Moment abgelenkt fährt Herr Wörner einen jungen Mann an, der noch am Unfallort seinen Verletzungen erliegt. Die Polizei ermittelt gegen Wörner – der einräumt, eventuell etwas schneller als erlaubt gefahren zu sein – wegen fahrlässiger Tötung. Im Zuge der Ermittlungen stoßen die Beamten jedoch darauf, dass das Unfallopfer, Nico Hellmann, genau im Moment des Unfalls vorhatte, eine junge Frau zu entführen um diese vermutlich zu töten. Er hatte sich hierzu heimlich im Keller des Hauses seiner Mutter, bei der er noch wohnt, einen Sektionsraum eingerichtet und dort bereits etliche Tiere seziert. Wie auf einem Video zu sehen ist, das Hellmann selber heimlich aus seinem Auto aufgenommen hatte – und das augenscheinlich die Entführung dokumentieren sollte – erkennt man, dass er ohne auf den Verkehr zu achten auf die Straße stürmt und dort überfahren wird. Die Staatsanwaltschaft fordert 18 Monate Haft ohne Bewährung, das Urteil bestätigt das Strafmaß, setzt die Strafe aber zur Bewährung aus. Vor der Verurteilung spricht die Mutter von Nico Herrn Wörner im Gericht an und dankt ihm dafür, dass er wohl Schlimmeres verhindert habe."
  "2x03": "Die Anfang 20-jährige Theresa und ihren zwei Jahre jüngeren Bruder Leonhard verbindet durch den frühen Tod ihrer Mutter und Schwierigkeiten mit dem Vater schon seit frühester Kindheit eine innige Beziehung. Gemeinsam verlassen sie das wohlhabende Elternhaus, weil Theresa an eine auswärtige Musikschule geht und sie ihren Bruder nicht zurücklassen möchte. Auf einer gemeinsamen Reise kommt es zu einem Motorradunfall, bei dem Leonhard ein Schädel-Hirn-Trauma erleidet. Nach dem Krankenhausaufenthalt richtet Theresa für sich und ihren Bruder, der nun im Rollstuhl sitzt, ein neues Zuhause ein, wo sie sich rund um die Uhr um ihn kümmert. Seine Hirnverletzung hat zu schwerwiegenden Persönlichkeitsveränderungen geführt und sein Kurz- und Langzeitgedächtnis zerstört. Was immer man ihm erzählt, hat er nach wenigen Minuten wieder vergessen und die Ärzte machen keine Hoffnung auf Besserung. Er wird zunehmend unselbstständiger und aggressiver und verlangt schließlich sogar regelmäßig von seiner Schwester, dass sie nackt für ihn am Cello musiziert. Nachdem er langsam auch sein Sprachvermögen verliert, ist Theresa irgendwann der permanenten Überforderung nicht mehr gewachsen und ertränkt ihren Bruder schweren Herzens in der Badewanne. Anschließend ruft sie Kronberg, der ein Bekannter von ihr ist, an und bittet ihn, sie zu vertreten. Bei der Polizei legt sie ein vollumfängliches Geständnis ab, in dem sie ihre Lebensgeschichte darlegt. Die Anklage lautet auf Mord, jedoch erhängt sich Theresa vor Prozessbeginn in der U-Haft."
  "2x04": "Der erfolgreiche Geschäftsmann Waller beauftragt Kronberg, seinen Halbbruder Fritz Meinering aus dem brasilianischen Gefängnis zu holen. Meinering sitzt dort unter schlimmsten Bedingungen ein, weil man ihn beim Schmuggeln von 12 Kilogramm Kokain erwischt hat. Vor Ort in Brasilien erzählt Meinering Kronberg, wie er nach einer furchtbaren Kindheit zum Alkoholiker wurde, Schulden bei den falschen Leuten machte und seinen ersten Überfall beging. Es folgte ein Entzug, eine neue Freundin und nach einem Rückfall eine brutale Eifersuchtstat, die ihn schließlich ins Gefängnis brachte. Dort lernte Meinering den Mann kennen, der ihn zu dem Kokainschmuggel überredete. Durch Kronbergs Engagement kommt Meinering frei und wird nach Deutschland überführt. Trotz bester Vorsätze wird er wieder straffällig. Waller erzählt Kronberg daraufhin, dass sein Vater und sein Großvater ebenfalls kriminell gewesen seien. Er glaubt, dass die Anlage dazu in der Familie liege, und möchte nichts mehr für seinen Halbbruder tun. Einige Jahre später erhält Kronberg die Nachricht, dass Waller bei einem Bootsunfall ums Leben gekommen ist."
charite:
  "1x01": "Im Dreikaiserjahr 1888 rettet der Arzt Emil Behring im Berliner Krankenhaus Charité der mittellosen Waise Ida Lenze mit einer Blinddarmoperation das Leben. Behring bewirbt sich bei Robert Koch, der an einem Heilmittel für Tuberkulose arbeitet. Die Stelle bekommt aber Paul Ehrlich. Kochs Ehe ist am Ende und er beginnt mit der Schauspieldebütantin Hedwig Freiberg eine Affäre. Mit dem Tod von Wilhelm I. besteigt dessen liberaler Sohn Friedrich Wilhelm als Friedrich III. den Thron. Insbesondere Rudolf Virchow hofft auf künftige Reformen. Nur 99 Tage später stirbt der neue Kaiser jedoch und Wilhelm II. besteigt den Thron („Dreikaiserjahr“ 1888). Während Idas Genesung, bei der sie von dem Medizinstudenten Georg Tischendorf gepflegt wird, verliert sie ihre Stelle als Kindermädchen und kann für ihre Behandlungskosten nicht aufkommen. So muss sie schließlich als Hilfswärterin in der Charité ihre Schulden abarbeiten."
  "1x02": "Zeitgleich mit Tischendorf freundet sich auch die zurückhaltende Schwester Therese mit Ida an. Diese hat unter der strengen Diakonissenoberin Martha zu leiden, entdeckt aber ihre eigene Leidenschaft zur Medizin, als sie den Koryphäen der Medizin wie Rudolf Virchow, Robert Koch, Emil Behring und Paul Ehrlich bei der Arbeit zuschaut und hilft. Tischendorf, der eher eine künstlerische Neigung hat, wird von seinem Vater zum Medizinstudium gedrängt. Ida und Behring verbindet eine frühere Bekanntschaft. Vor einigen Jahren war sie als Tochter eines Arztes eine „gute Partie“ und wurde von Behring heftig umworben. Nach dem Tod ihrer Eltern ließ Behring sie aus ihrer Sicht jedoch im Stich. Behring lehnt diesen Vorwurf ab, und erklärt, dass sie quitt seien, nachdem er ihr Leben gerettet hat. Beide nähern sich dennoch langsam wieder einander an. Er duldet, dass Ida im Verborgenen seine Vorlesung hört, und da Frauen das Studium in Deutschland verboten ist, ermuntert er sie, in der Schweiz Medizin zu studieren. Er erzählt von Stipendien und seinem eigenen, schwierigen Zugang zum Studium. Er schenkt Ida ein Medizinlehrbuch. Die Diphtherie fordert als schwere Kinderkrankheit viele Opfer. Auch die Nichte von Spinola, dem Direktor der Charité, erkrankt schwer. Behring rettet sie mit einem Luftröhrenschnitt vor dem Tod. Spinola revanchiert sich damit, dass er Behrings Forschung an einem Diphtherieheilmittel fördert und Koch veranlasst, Behring in sein Forschungsprojekt aufzunehmen. Ida wird indirekt beschuldigt, Opiumtinktur (auch Laudanum genannt) zu verschwenden, weil sie fordert, nicht nur zum Besuch des Kaisers mehr Schmerzmittel auszugeben. Tatsächlich deckt sie Behring, der seine manisch-depressiven Stimmungen mit dem Mittel bekämpft. Beim Besuch des Kaiserpaares in der Charité hat der Monarch nur Kochs Forschung im Blick und nötigt ihn, zum Ärztekongress ein Heilmittel gegen die Tuberkulose zu präsentieren. Die Gattin des Kaisers, Auguste Viktoria, besichtigt den Rest der Klinik, hat aber kein Interesse an modernen Methoden, sondern fördert die Religiosität."
  "1x03": "Emil Behring, der die Technik des Kaiserschnitts beherrscht, soll der hochschwangeren Hedda, der Frau seines Kollegen Paul Ehrlich, bei einer schweren Geburt helfen. Er weigert sich zunächst, da er unter Opiumentzug steht und nicht operieren kann, wird aber von Ida überzeugt, den Eingriff vorzunehmen, bei dem sie ihm auch erfolgreich assistiert. Das Kind überlebt die Geburt nicht, jedoch kann Hedda gerettet werden. Paul Ehrlich ist dankbar und überrascht, dass ausgerechnet der sprunghafte Behring ihm und seiner jüdischen Familie in der Stunde der Not beisteht. Er kann sich entgegen seiner ursprünglichen Meinung jetzt doch eine wissenschaftliche Zusammenarbeit mit ihm vorstellen. Beim Internationalen Medizinkongress kündigt Koch vorsichtig ein Tuberkuloseheilmittel an und wird dafür frenetisch gefeiert. Georg Tischendorf, immer noch entschlossen, Ida zu heiraten, tritt einer schlagenden Verbindung bei, um seinen Vater zur Zustimmung zu bewegen. Er wendet sich neben dem Studium der Fotografie zu, worin Ida ihn bestärkt. In der trunkenen Euphorie nach seiner ersten Mensur, in der er auch gleich einen Schmiss erhalten hat, macht er ihr einen Heiratsantrag. Ida nimmt aber nicht an, weil sie sich nicht zwischen ihm, Behring oder einem möglichen Medizinstudium in der Schweiz entscheiden kann."
  "1x04": "Diakonisse Therese, Freundin Idas, erkrankt an Lungen-Tuberkulose. Als sie die Erkrankung nicht länger verbergen kann, soll sie die Charité verlassen, um im 500 Kilometer entfernten Mutterhaus in Kaiserswerth zu sterben. Ida und Virchow setzen sich erfolgreich dafür ein, dass Therese in der Charité in einem Isolierzimmer bleiben kann. Robert Koch erprobt sein Tuberkulose-Heilmittel (Tuberkulin) an sich selber und erkrankt schwer. Ida kann ihn nicht ausreichend pflegen und erreicht, gemeinsam mit seiner Geliebten Hedwig, dass er bei sich zu Hause von seiner Frau gepflegt wird. Nach Kochs Genesung probiert dieser das Mittel auf deren Wunsch an seiner Geliebten aus. Die Reaktionen sind bei ihr nicht ganz so heftig. Behring hat inzwischen an Kaninchen den Erfolg seines Diphtherie-Serums gesehen, doch die Präsentation vor Fachpublikum scheitert, weil die Infizierung der Versuchskaninchen aufgrund der geringen Außentemperatur fehlgeschlagen ist. Die todkranke Diakonisse Therese erhält als erste Patientin das Tuberkuloseheilmittel. Später zeichnet sich durch Todesfälle langsam ab, dass etwas mit dem Mittel nicht stimmen kann. Auch Paul Ehrlich, Kollege von Koch, der die Tuberkulose bereits überstanden hatte, erkrankt erneut."
  "1x05": "Durch die Nachricht, dass es an der Charité ein Tuberkuloseheilmittel gibt, kommen viele Kranke mit der Hoffnung auf Heilung nach Berlin. Koch hofft auf einen wirtschaftlichen Erfolg, um sich für ein gemeinsames Leben mit Hedwig von seiner Frau scheiden zu lassen. Es häufen sich aber die Fehlschläge bei der Verwendung des Heilmittels und Virchow vermutet sogar die Schädlichkeit. Ida zweifelt, ob es richtig war, Schwester Therese mit dem Mittel zu behandeln. Auch Therese stirbt an der Krankheit. Die Untersuchung durch Virchow nach ihrem Tod erhärtet den Verdacht, dass das Tuberkulin den Krankheitsverlauf sogar verschlimmern kann. Als die Wärterin Stine an Diphtherie erkrankt, kommt Behrings unerprobtes Diphtherie-Serum zum Einsatz. Das Mittel schlägt an und Stine wird geheilt. Davon sind nicht nur Verwaltungsdirektor Spinola und seine Tochter Else beeindruckt, auch Ida will jetzt Medizin studieren. Mit diesem für eine Frau in ihrer Zeit gesellschaftlich missbilligten Plan stößt sie auch bei Georg auf Unverständnis."
  "1x06": "Im Berliner Zoo werden Menschen wie Tiere ausgestellt. „Hagenbecks Völkerschau“ zeigt Menschen vom Indischen Subkontinent. Eine Inderin ist an Pocken erkrankt, einer durch die Impfpflicht im Deutschen Reich ausgerottete Krankheit, und damit für die Medizinstudenten lehrreich. Virchow, der anthropologisch geforscht hat, nimmt die Inderin als Patientin auf. Die Wärterin Stine, die die Patientin zunächst als Kannibalin sieht, nimmt sich ihrer an und steht ihr bis zum Tod bei. Koch und Hedwig heiraten, isolieren sich dadurch jedoch infolge der gesellschaftlich seinerzeit geächteten Scheidung. Die Arbeit von Ehrlich und Behring am Diphtherieserum gerät durch Kochs wissenschaftliche Misserfolge und seine private Isolation ins Hintertreffen. Behring gelingt es derweil, sein Serum in Leipzig mit Erfolg testen zu lassen. Ida wendet sich wieder stark Behring zu, der ihre Näherungsversuche aber nicht erkennt. Als Virchow seinem Serum schließlich die Wirksamkeit bescheinigt und sich der Verkauf der Rezeptur an Hoechst abzeichnet, reißt das Behring aus seiner Lethargie. Nachdem die schlechten Arbeitsbedingungen in der Charité öffentlich Thema in der Zeitung geworden sind, kommt es nach Virchows Vermittlung zur Gründung eines Pflegevereins, einer Art Gewerkschaft des Pflegepersonals. Dies führt auch dazu, dass sich die Oberin Martha ihrer Arbeitsgrundlage entzogen sieht und verkündet, den Dienst in der Charité zu beenden. Zunehmend erschweren antisemitische Tendenzen die Arbeit von Ehrlich, der zudem von Behring um Teile seines Anteils im Vertrag mit Hoechst geprellt wird. Mehr oder weniger unfreiwillig muss Behring sich mit Else verloben, der Tochter von Verwaltungsdirektor Spinola. Dies gibt für Ida den Ausschlag, die Zugangsprüfung zum Medizinstudium in Zürich anzugehen. Ihrer Schulden ledig kann sie die Charité und Berlin verlassen."
kranitz:
  "1x01": "Tini und Jochen sehen kritisch auf ihre Umwelt. So glauben sie beispielsweise nicht an die „allgemein verbreitete Wahrheit“ über die Terroranschläge vom 11. September 2001. Bei einem Vortrag über die „Wahrheit“ von 9/11 lernten sich der frühere Bauingenieur und die Hundephysiotherapeutin kennen und lieben. Unter anderem gingen beide während der Covid-19-Pandemie auf Querdenker-Demonstrationen mit. Seit einiger Zeit ist Tini wie besessen von dem Hund der Moderatorin Dunja Hayali namens Wilma. Doch aus Jochens Sicht dienen Soziale Medien und alles, was man zu Wilma im Netz findet, lediglich der Manipulation am Menschen, der seine Frau nun zu erliegen droht. Kranitz hat eine Lösung parat."
  "1x02": "„T’n’T“, Tom (Thomas) und sein „Bro“ Toto (Thorsten) sind seit dreizehn Jahren Freunde, teilen alles im Leben, wohnen gemeinsam und sind inzwischen als Influencer-Duo äußerst erfolgreich. Sie suchen Kranitz auf, um ihren Kanal erneut bedienen zu können. Kranitz nutzt die Gelegenheit, um mit den beiden eine lukrative Wette abzuschließen. Die Dinge nehmen einen unvorhergesehenen Lauf."
  "1x03": "Jörn und Mareike leben vorbildlich umweltbewusst und engagieren sich für den Erhalt der Natur. So engagiert sich Jörn unter anderem bei der Initiative „Flöten für Kröten“ zum Amphibienschutz. Auch miteinander sind sie extrem rücksichtsvoll, den anderen bloß nie verletzen! Überhaupt ist Pazifismus wesentlich in ihrem Leben. Die enorme Rücksicht aufeinander führt jedoch auch dazu, dass es im Bett nicht mehr klappt. Kranitz schlägt beiden vor, sich dem Partner gegenüber wesentlich weniger rücksichtsvoll zu verhalten und wählt das Ehepaar Donald und Melania Trump zum Vorbild."
  "1x04": "Manni, ein alter Freund von Kranitz, hat einen Job als Auftragskiller versemmelt und sucht Rat bei Kranitz. Heino zahlte 90.000 Euro um seine Ehefrau Sandy zu überführen, ihn zu betrügen, und zudem auch umzubringen, sollte sie tatsächlich untreu sein. Sie zu überführen gelang, jedoch bringt Manni es nicht übers Herz, die professionelle Heiratsschwindlerin, die sich ebenfalls in Manni verliebt hat, beiseite zu schaffen. Da beide so ihre Jobs nicht mehr ausführen können, ist Kranitz gefordert."
  "1x05": "Jutta und Bernd hatten sich in den Wilden 70ern kennengelernt. Ein freies Leben abseits des gesellschaftlich üblichen Daseins ließ beide weder heiraten noch einer geregelten Arbeit nachgehen. Für Jutta unerwartet erhielt sie einen romantischen Heiratsantrag und sieht die gemeinsamen Ideale schwinden. Kranitz schlägt radikale Maßnahmen vor."
  "1x06": "Kraftfahrer Dennis sieht seine Ehe auf der Kippe und erwartet von seiner Ehefrau Nyota, ihre Rolle als Hausfrau und Mutter wie zu besten Zeiten auszufüllen. Nyota gibt eine Affäre zu, die sie jedoch nicht wie zunächst vermutet mit einer neuen Partnerschaft auslebt. Es ist etwas völlig anderes, dem sie sich leidenschaftlich widmet. Das Paar wieder in gleiche Bahnen zu lenken, ist eine besondere Herausforderung für Kranitz."
  "2x01": "Kranitz erwartet seinen Vater Lothar, der sich zeitlebens nie für seinen Sohn interessierte und lediglich mit Abwesenheit glänzte. Sein erster Besuch bei seinem Sohn nach über zehn Jahren findet in dessen Therapieräumlichkeiten statt. Der Versuch, seinen Vater zu einem privaten Abendessen zu überreden, scheitert. Der Aufenthalt des Vaters bei seinem Sohn wird zur Paartherapie-Sitzung, denn Lothar bringt seine weitaus jüngere Assistentin Madison mit. Es stellt sich heraus, dass beide ein loses intimes Verhältnis miteinander haben, wobei es seit einiger Zeit im Bett nicht mehr so läuft. Beide wollen zunächst nicht zugeben, dass sie sich mehr als eine Bettgeschichte wünschen. Auch kommt ans Licht, dass Lothar keine Chance auf die Position eines Dekans an der Stanford-Universität haben wird. Kranitz findet eine Lösung für die Probleme der beiden."
  "2x02": "Astrid und Mike teilen nicht nur ihren kompletten Alltag, sondern auch seit 23 Jahren in einer 2-Zimmer-Wohnung Tisch und Bett miteinander. Wären sie nicht Mutter und Sohn, wäre dies eigentlich die perfekte Beziehung. Die Verkäuferin in einer Parfümerie und der Informationstechniker merken jedoch, dass zuletzt etwas nicht stimmt. Sie meint, dass Mike Hilfe braucht. Kranitz ist sich sicher, Mike hat einen Triebstau. Um das Problem zu lösen, bietet Kranitz Mike Unterkunft und Job. Mike soll die „Krating“-App, eine Dating-App entwickeln, die Kranitz zu neuer Kundschaft auf dem Immobilienmarkt und auf seiner „Couch“ verhelfen soll. Die kommende Sitzung mit Astrid und Mike bietet Überraschendes."
  "2x03": "Celine (eigentlich Katrin) und Noah sind die ersten Nutzer und auch das erste Paar der neuen Kranitz-Dating-App „Krating“. Sie studiert Kunstgeschichte, steht auf Party und kennt jeden in der Szene. Mit knapp 30 sieht sie in der App ihre letzte Chance auf eine feste Beziehung. Auch Noah sucht eine feste Bindung. Er arbeitet als Security und ist charakterlich eher ruhig und verbringt seine Freizeit gern auf der heimischen Couch. Nachdem seine letzte Beziehung scheiterte, versucht er wieder Vertrauen in das weibliche Geschlecht aufzubauen. Kranitz Expertise ist gefragt, um dem Paar den Weg zu ebnen und seiner App den nötigen Schwung zu verleihen."
  "2x04": "Manni hat eine Persönlichkeitsstörung entwickelt. Seine zweite Persönlichkeit, Mathieu, ist friedfertig und einfühlsam. Iwan Meierle, mit dem Manni früher beruflich und privat gemeinsame Sache machte, hat nach einem Gefängnis-Aufenthalt noch eine Rechnung mit Manni offen. Beim Gespräch mit Kranitz diskutieren Iwan und Manni/Mathieu die Geschehnisse der Vergangenheit."
stromberg:
  "1x01": "Die Capitol-Versicherung ist Schauplatz einer TV-Dokumentation. Ein Kamerateam begleitet den Büroalltag der Abteilung Schadensregulierung M bis Z, die von Bernd Stromberg geleitet wird, mit der Kamera. Stromberg möchte natürlich, dass sein Team stets von der besten Seite gezeigt wird, zumal ihm seine Vorgesetzte Frau Berkel mitteilt, dass sein Team im Rahmen einer Umstrukturierung der Schadensregulierungsabteilungen unter besonderer Beobachtung steht. Doch Stromberg gelingt es selten, die Abteilung in einem guten Licht stehen zu lassen. Auf der Toilette wird eine obszöne Zeichnung von Tanja Seifert, einer Sachbearbeiterin, entdeckt. Berthold Heisterkamp, der von seinen Kollegen stets Ernie genannt wird, nimmt sich der Tätersuche an, indem er Kollegen Fragen zum Tathergang stellt und Zeichnungen desselben Motivs an ein Flipchart malen lässt. Stromberg versucht derweil einen besseren Parkplatz auf dem Gelände der Firma zu bekommen. Dem für die Firmenparkplätze zuständigen Kollegen Hilpers bietet Stromberg während eines Gesprächs – zur Beeinflussung von dessen Entscheidung – eine Zigarre an, obwohl ihm bekannt ist, dass er unter schwerem Asthma leidet. „Röchel-Hilpers“ landet schließlich im Krankenhaus und stirbt. Stromberg, der von Hilpers’ Frau beschuldigt wird, ihren Wagen gerammt zu haben, nimmt sich der armen Frau an, doch macht er ihr im Gespräch zusätzlich noch einen unsittlichen Antrag. Auf einem Video einer Überwachungskamera ist zu erkennen, dass Stromberg den Wagen von Frau Hilpers tatsächlich rammte. Den Schaden zahlt er bar an die Witwe aus. Als Stromberg im Beisein von Frau Berkel ein Organigramm der Abteilung an das Flipchart malen möchte, kommen die gesammelten Zeichnungen der Kollegen, die Ernie hat anfertigen lassen, zum Vorschein. Tanja ist zutiefst verletzt und verärgert. Aufgrund der markanten Form des „j“ wird Stromberg am Ende als Urheber der Zeichnung von Tanja auf der Toilette entlarvt."
  "1x02": "Strombergs Kollege und stärkster Konkurrent im Kampf um die Gesamtleitung der Abteilung Schadensregulierung Sinan Turçulu besteht eine berufliche Weiterbildung mit einem Spitzenergebnis und wird von Frau Berkel dafür sehr gelobt. Strombergs Abteilung jedoch fällt während eines Feueralarms wieder negativ auf, als Frau Berkel feststellt, dass Stromberg offenbar immer noch keinen Brandschutzbeauftragten bestimmt hat, obwohl sie ihn bereits einige Monate zuvor darauf hingewiesen hatte. Stromberg entscheidet spontan, dass Sachbearbeiter Ulf Steinke diesen Posten ab sofort übernimmt. Ulf steht dieser Entscheidung jedoch widerwillig gegenüber. Um wieder einen guten Eindruck bei Frau Berkel hinterlassen zu können, plant Stromberg, ihr zum Geburtstag ein besonderes Geschenk zu machen. Seine Idee, ihr einen Massagesessel zu schenken, geht jedoch gründlich schief. Frau Berkel entdeckt den Sessel in Strombergs Büro und fordert ihn auf, ihn unverzüglich aus dem Büro zu entfernen. Immer noch auf der Suche nach einem Geschenk, bekommt Stromberg Wind davon, dass Turçulu bei der Internet-Auktionsplattform eBay auf Karten für ein Robbie-Williams-Konzert bietet. Dieses Top-Geschenk möchte er sich nicht entgehen lassen. Er findet das Angebot im Internet, und als nur noch wenige Sekunden zum Bieten übrig sind, manipuliert er den Feuermelder in seinem Büro durch ein Feuerzeug so, dass ein weiterer Feueralarm ausgelöst wird. Ulf kommt seiner Tätigkeit als Brandschutzbeauftragter nach und versammelt das ganze Team – bis auf Stromberg – vor dem Unternehmen. Stromberg bleibt währenddessen in seinem Büro und gibt in aller Ruhe das letzte und erfolgreiche Gebot für die Konzertkarten ab."
  "1x03": "Der Koch der Kantine stellt Stromberg vor seinen Kollegen und – noch viel schlimmer – vor seinem Konkurrenten Turçulu bloß. Das kann Stromberg nicht auf sich sitzen lassen. Er hält sein Team dazu an, die Kantine für die nächsten Tage zu boykottieren. Ernie fühlt sich von seinen Kollegen gemobbt. Stromberg geht mit Tanja zum Italiener essen. Ernie kommt hinzu und erzählt ihm von den Mobbingaktionen. Stromberg ruft in der Küche an und gibt sich als Mitarbeiter des Gesundheitsamtes aus. Er bestellt Mäuse, was von Berkel entdeckt wird."
  "1x04": "Herr Fritsche stellt als Rollstuhlfahrer den Anspruch auf Strombergs neuen Parkplatz auf E2. Stromberg hingegen hält so sehr an seinem Parkplatz fest, dass Herr Fritsche das Thema dem Betriebsrat übergibt. Ulf hat Geburtstag. Sabine Buhrer vom Betriebsrat drängt Ulf dazu, sich rechtzeitig für die Fortbildung anzumelden. Gleichzeitig macht Stromberg Ulf Hoffnungen auf eine Beförderung."
  "1x05": "Turçulu fällt durch Integration von zwei Behinderten in seiner Abteilung positiv auf. Stromberg will mithalten und bemüht sich daher um mehr soziales Engagement in seiner Abteilung. Ina, das Patenkind Erikas, wird von Stromberg für einen Zeitungsartikel als „Pflegekind der Abteilung“ benutzt."
  "1x06": "Weil die Diebstähle der Mitarbeiter zugenommen haben, soll Stromberg seine Abteilung genauer unter die Lupe nehmen. Bei einem Einzelgespräch mit Erika stellt sich heraus, dass sie mehrmals Toner für den Drucker entwendet hat. Berkel fordert Stromberg dazu auf, Erika zu entlassen. Stromberg braucht sie jedoch, um einen wichtigen Kunden nicht zu verlieren. Daraufhin erzählt Stromberg seiner Chefin, dass Erika Brustkrebs habe."
  "1x07": "Stromberg soll ein Rahmenprogramm für die Betriebsfeier organisieren. In der Abteilung der Schadensregulierung ist durch eine dem Betriebsrat nahe Quelle durchgesickert, dass eine Kündigung anstehen soll. Ernie wird so nervös, dass bei ihm der Stress in einem Kreislaufkollaps gipfelt. Stromberg verhandelt mit Herrn Kitter, dem Manager des Schlagersängers Roland Kaiser; jedoch verläuft das Treffen nicht erfolgreich, da Stromberg die Gage für überzogen hält. Ulf ermuntert Stromberg, selbst als Entertainer aufzutreten, was letztlich sogar sehr gut gelingt. Stromberg versäumt es dabei, darüber zu entscheiden, welchem seiner Mitarbeiter aus der Abteilung gekündigt werden soll. Der Beschluss wird ihm dann allerdings abgenommen. Schließlich unterschreibt Stromberg ohne genaueres Hinschauen ein ihm vorgelegtes Papier, so dass erneut Erika gekündigt werden soll."
  "1x08": "Erika feiert ihren Ausstand. Währenddessen rückt Stromberg im Bewerbungsverfahren um die Gesamtleitung seiner und Turçulus Abteilung nach. Nach einem Assessment-Center wird entschieden, dass die Stelle um die Gesamtleitung erneut ausgeschrieben und an einen externen Mitarbeiter vergeben wird."
  "2x01": "Timo Becker erscheint als Strombergs Vorgesetzter und neuer Abteilungsleiter der zusammengelegten Capitol-Schadensregulierung. Er findet Stromberg gleich am ersten Tag unsympathisch. Zudem ist Strombergs Frau Birgit mit seinem Schwiegervater, der an Alzheimer erkrankt ist, zu Besuch in der Capitol. Der Schwiegervater steckt einen großen Teil von vertraulichen K1-Berichten in den Aktenvernichter."
  "2x02": "Erika hat sich vor Gericht erfolgreich in ihren alten Job zurückgeklagt. Herr Becker wird von der Abteilung als sympathisch empfunden, was Stromberg veranlasst, ebenfalls beliebt sein zu wollen. Die Abteilung der Schadensregulierung beschließt, zum Bowling zu gehen. Die Abteilung bekommt dort erstmals Ernies Freundin Vanessa zu sehen. Stromberg sieht das Bowling als Duell zwischen ihm und Herrn Becker und betrinkt sich dabei sehr."
  "2x03": "Stromberg ist dabei, sich von seiner Frau Birgit scheiden zu lassen. Nachdem die Schadensregulierung neu strukturiert wurde, stehen jetzt Einführungskurse für eine neue Software, die Herr Becker mitentwickelt hat, auf dem Programm. Kerstin Aumann unterrichtet den Kurs für die neue Software. Am Ende soll die Abteilung einen Test bestehen. Stromberg versucht vergeblich, sich um den Abschlusstest herumzumogeln. Schließlich kann er den Test durch Erikas Hilfe gerade noch so bestehen; Erika hatte zuvor selbst große Probleme, mit dem neuen System zurechtzukommen."
  "2x04": "Stromberg ist frisch geschieden. Er behauptet immer wieder, dass Herr Becker schwul sei, unter anderem auch in einer Frauenrunde in der Kantine. Hier erfährt er auch, dass man beim Betriebssport-Badminton gute Chancen habe, eine Partnerin zu finden. Ernie soll auf Anweisung von Herrn Becker seine Ideen in einer Arbeitsgruppe ausarbeiten. Stromberg geht mit Sabine zum Badminton. Dabei wird Alexandra Klausen heftig von ihm angegraben. Nachdem Herr Becker von Strombergs Behauptungen über ihn erfährt, lässt er ihm eine Abmahnung zukommen."
  "2x05": "Nachdem Stromberg eine Abmahnung bekommen hat und Ernie zunehmend mehr Kompetenzen in der Abteilung bekommt, gibt Stromberg vor, genauso wie Herr Becker ein Schalke-Fan zu sein. Ernie hat mit seiner Arbeitsgruppe Erfolg. Herr Becker teilt ihm sogar eine Online-Darstellung zu. Stromberg soll einen Wasserschaden betreuen, vernachlässigt die Aufgabe jedoch völlig. Die Abteilung der Schadensregulierung schaut sich ein Spiel zwischen Dortmund und Schalke in einer Kneipe an."
  "2x06": "Stromberg übernachtet in der Capitol, da er immer noch keine neue Wohnung gefunden hat. Theo Hölter, ein alter Schulfreund von ihm, erscheint in der Capitol. Er nimmt Stromberg für kurze Zeit in seiner Wohnung auf. Ernie soll laut Herrn Becker an seinen „social skills“ arbeiten. So gründet er eine Lotto-Tippgemeinschaft, die bei der abendlichen Ziehung sogar mehrere hundert Euro gewinnt. Da Strombergs Tipp der richtige war, beansprucht er den Gewinn für sich allein, obwohl er der gesamten Tippgemeinschaft zusteht. Theo ist ein Promoter, der der gesamten Abteilung Freikarten für ein Konzert der noch unbekannten Band „Hypernoise“ besorgt. Ernie hat jedoch am gleichen Abend eine Lottoparty organisiert. Tanja überlässt ihre Wohnung freundlicherweise den Bandmitgliedern von Hypernoise zum Übernachten, da sie sonst keine Übernachtungsmöglichkeit hätten. Tanja übernachtet währenddessen bei einer Freundin. Am nächsten Tag muss sie feststellen, dass die Bandmitglieder in ihrer Wohnung randaliert und sie verunreinigt hinterlassen haben. Sie spricht von einem Schaden in Höhe von 3000 €. Da sie nicht dagegen versichert ist, bietet ihr Stromberg den Lottogewinn als Entschädigung an."
  "2x07": "Hans Georg Althoff beabsichtigt seine Firma bei der Capitol zu versichern. Herr Becker rügt Stromberg vor den Augen des Kunden Althoff, bevor er sich auf eine Geschäftsreise begibt. Entgegen der Anweisung von Herrn Becker verhandelt Stromberg weiter mit Herrn Althoff, sodass dieser schließlich den Vertrag unterschreibt. Stromberg und Althoff verstehen sich gut, da sie ähnliche Ansichten über Mitarbeiterführung haben."
  "2x08": "Aufgrund eines Wechsels der Putzfirma werden die Büroräume der Capitol nun zu Beginn der normalen Arbeitszeiten gereinigt. Die Putzfrau Nyota N’yangasongwa wird von Stromberg sexuell belästigt. Vergeblich versucht er, Ernie zu einer Falschaussage zu bewegen, um sich so zu entlasten. Daraufhin wird ein Ausschuss gebildet, der vorwiegend aus weiblichen Mitgliedern der Personalabteilung und des Betriebsrats besteht. Es werden auch die Aufnahmen des Kamerateams ausgewertet, welche die Vorgänge im Büro dokumentieren. Darauf ist die sexuelle Belästigung mehr oder weniger gut zu erkennen. Stromberg droht eine fristlose Kündigung. Auf Anraten von Herrn Becker sucht Stromberg Frau N’yangasongwa in ihrer Wohnung auf, um sich bei ihr zu entschuldigen. Dabei wird er vom Ehemann der Putzfrau körperlich angegriffen, was schließlich zum Erscheinen der Polizei und zur Abschiebung von Frau N’yangasongwa in ihr Heimatland aufgrund fehlender Aufenthaltsgenehmigung führt."
  "2x09": "Stromberg ist durch seine Mitarbeiter und Herrn Becker zunehmend frustriert. Zudem wird er von der Wochenkonferenz der Abteilungsleiter ausgeschlossen. Er bewirbt sich daraufhin bei der Helios, einem Konkurrenzunternehmen der Capitol. Das Bewerbungsgespräch verläuft gut. Stromberg verbreitet in der Capitol die Botschaft, dass er eine neue Stelle habe, und verschickt über die Hauspost seine Kündigung. Er macht sich schließlich bei der Abteilung und bei Herrn Becker besonders unbeliebt. Weil Stromberg absichtlich sein Alter falsch angegeben hat, bekommt er später von der Helios jedoch eine Absage. Nur indem er die Hauspost abfängt, bleibt seine Kündigung fast ohne Folgen."
  "2x10": "Die Capitol veranstaltet zum 35-jährigen Firmenjubiläum einen Tag der offenen Tür. Auf Wunsch von Herrn Becker zeigt der Event-Manager, Herr Pöhlmann, ein Video mit dem Auftritt eines Kinderchors. Dabei beleidigt Stromberg unwissentlich die Tochter von Herrn Becker. Er wird daraufhin in das Archiv der Capitol versetzt, in dem auch Herr Wuttke arbeitet. Stromberg versucht der Langeweile im Archiv zu entfliehen und vertreibt sich die Zeit an anderen Orten. Ernie organisiert beim Tag der offenen Tür einen Infostand, was er als Karrierebaustein ansieht, da er wieder ein Stück Verantwortung übernimmt. Später tritt er noch als Clown auf und kann daher nicht am Geburtstag von Vanessas Mutter erscheinen, was zu Spannungen zwischen den beiden führt. Im Büro steigt eine kleine Party anlässlich der Verlobung von Tanja und Ulf. Stromberg gibt bei Herrn Pöhlmann vor, dass er durch seine Fernsehpräsenz mittlerweile den Status eines Prominenten erreicht habe. Pöhlmann und Stromberg kommen ins Geschäft. Später sieht man Stromberg in einem Autohaus, wo er eine spärlich besuchte Autogrammstunde gibt."
  "3x01": "Seitdem Stromberg die Capitol medienwirksam vertritt, genießt er den Schutz von Herrn Wehmeyer, sodass er wieder in seine alte Abteilung Schadensregulierung versetzt wird. Jennifer Schirrmann kommt als Rückkehrerin nach mehrjähriger Kinderpause in die Abteilung. Ernie trauert seiner verstorbenen Mutter nach. Tanja und Ulf sind auf der Suche nach einer gemeinsamen Wohnung und deren Einrichtung, doch Ulf ist eher daran interessiert die Zeit mit Jennifer zu verbringen. Stromberg und Ulf konkurrieren schließlich beide miteinander um Jennifer. Schließlich lehnt Jennifer die Avancen von Stromberg ab."
  "3x02": "Nachdem Jennifer Schirrmann seine Avancen abgelehnt hat, beginnt Stromberg ein Verhältnis mit der eher unscheinbaren Sachbearbeiterin Nicole. Wehmeyer möchte, dass Stromberg für einige kurz vor der Pensionierung stehende Mitarbeiter der Capitol einen Film über die Versicherung dreht und eine Rede hält. Stromberg erzählt Wehmeyer, dass er eine neue, attraktive Freundin habe. Wehmeyer wird neugierig und schlägt vor, dass er sie mitbringt. Stromberg möchte die Beziehung jedoch geheim halten. Währenddessen hat Ulf neue Lautsprecher in seinem Auto eingebaut bekommen. Stromberg erwischt Ulf und Tanja dabei, wie sie im Auto auf dem Firmenparkplatz miteinander Sex haben. Stromberg beschäftigt Nicole mit unnötigen Arbeiten, um sie nicht zur Betriebsfeier mitnehmen zu müssen. Während der Feier erscheint sie, beendet die Affäre mit Stromberg vor den Augen der Anwesenden und lässt sich in eine andere Abteilung versetzen."
  "3x03": "Während der Karnevalszeit wird der Druck auf die Abteilungen immer größer. Um Wehmeyer zu beeindrucken, gibt Stromberg vor, dass seine Abteilung zusätzlich die gesamte Unfallkonsolidierung übernehmen könne, unterschätzt dabei jedoch, wie viel Arbeit dies tatsächlich bedeutet. Einige Mitarbeiter wollen den Betriebsrat darüber informieren, ohne zunächst zu wissen, dass Stromberg selbst hinter dieser Idee steckt. Auch Herr Becker ist davon nicht begeistert. Stromberg glaubt, dass er mit einer Karnevalsfeier in der Abteilung die Stimmung auflockern könnte. Ernie nimmt Antidepressiva und ist daher seit dem Tod seiner Mutter zum ersten Mal wieder in guter Stimmung. Stromberg macht sich Sorgen, dass er an Hautkrebs erkrankt sein könnte."
  "3x04": "Die schwangere Maja Decker soll wegen einiger Fehler nach ihrem Mutterschutz nicht weiterbeschäftigt werden. Stromberg berichtet Herrn Wehmeyer darüber, sodass Herr Becker gezwungen ist, die Kündigung rückgängig zu machen. Nachdem Stromberg sogar eine Ausnahmegenehmigung für Ernies Sandwichtoaster bekommt, steigt seine Beliebtheit deutlich. Stromberg wird von der Abteilung als Held angesehen und von nun an Lurchi genannt. Die Schadensregulierung soll laut Geschäftsleitung zusätzliche Arbeit ohne Lohnausgleich bekommen. Stromberg will daraufhin eine Demonstration in Wehmeyers Büro veranstalten, was jedoch komplett fehlschlägt. Schließlich soll Jennifer Schirrmann entlassen werden, da Maja nun bleiben darf. Ernie macht sich in der Abteilung beliebt, indem er kostenlos Sandwiches verteilt."
  "3x05": "Um bei Herrn Wehmeyer positiv aufzufallen, startet Stromberg medienwirksam eine Aktion „Diskriminierung – ohne mich“, die sich gegen die Diskriminierung von Minderheiten in der Capitol richtet. Jochen Schüller, der Fotoreporter der hauseigenen Zeitung Capitol Intern, flirtet als Homosexueller mit Stromberg, ohne dass dieser etwas von seinen Absichten ahnt. Erika wird vom Außendienstler Herrn Wiebrecht umgarnt und soll ihm dabei helfen, einen schweren Fehler in der Abrechnung zu korrigieren. Herr Wiebrecht lädt Erika zu einem Essen ein, bei dem sie jedoch nicht erscheint. Ihre Kollegen hatten ihr zuvor eingeredet, dass er sie nur dazu ausnutze, damit sie seinen Abrechnungsfehler ausbügelt. Wehmeyer ist von der Aktion nicht begeistert. Stromberg verrät Wehmeyer, dass Jochen schwul sei."
  "3x06": "Herr Becker hat private Probleme. Seine Frau will sich von ihm trennen, da er „zu viel arbeitet“. Deshalb überträgt er Stromberg zunächst wieder die Leitung der Abteilung. Ein Besuch aus der Zentrale kündigt sich an. Ernie bringt „Lulu“, den Hund seiner verstorbenen Mutter, mit ins Büro. Weil Ulf seine eigene Wohnung bereits gekündigt, aber noch keine gemeinsame Wohnung mit Tanja gefunden hat, bringt er sein Privateigentum in den Räumlichkeiten der Abteilung unter. Rudi Wippermann aus der Zentrale überprüft als Mitglied der internen Revision die einzelnen Abteilungen, ob dort alles nach Vorschrift erledigt wird. Die Schadensregulierung fällt ihm im Vergleich zu anderen Abteilungen jedoch angenehm auf. Vor Wippermanns Besuch hat Stromberg erfahren, dass dieser Hunde im Büro nicht duldet, sodass er Lulu kurzerhand verschenkt hat, ohne Ernie zu fragen."
  "3x07": "Erika will für den Betriebsrat kandidieren, weil sie Strombergs Verhalten nicht länger dulden will. Walter Loermann wird von Stromberg dazu gedrängt, gegen Erika für den Betriebsrat zu kandidieren. Weil Stromberg in der Kantine erzählt, dass Loermann depressiv sei und sich womöglich erhängen werde, wenn er nicht gewählt wird, erhält er mehr Stimmen. Erika verliert die Kandidatur und wird am Ende der Episode wegen eines Herzinfarkts ins Krankenhaus eingeliefert. Tanja und Ulf geben eine Einzugsparty in ihrer neuen Wohnung."
  "3x08": "Stromberg und einige Kollegen besuchen Erika im Krankenhaus. Stromberg hat Schwierigkeiten, einen Vorgang von „Degustra“ zu bearbeiten, für den Erika zuständig war. Es wird dazu ein spezieller Verrechnungsschlüssel benötigt. Erika kann Stromberg jedoch nicht helfen, da sie Schlafmittel bekommen hat und geistig abwesend ist. Stromberg vermutet, dass er die Unterlagen im Krankenhaus vergessen hat. Als sie ein weiteres Mal zu Besuch kommen, erfahren sie, dass Erika verstorben ist."