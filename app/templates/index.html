<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubTranslate AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="container-fluid mt-4">
        <h2 class="mb-4">🎬 SubTranslate AI</h2>
        
        <div class="row">
            <!-- SEITENLEISTE (Upload & Einstellungen) -->
            <div class="col-md-4">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h5 class="card-title">📂 Neues Projekt</h5>
                        <form id="uploadForm">
                            <div class="mb-3">
                                <label class="form-label">Serien-/Filmprofil</label>
                                <select class="form-select" name="profile_key" id="profileKey">
                                    <option value="default">Standard</option>
                                    <option value="charite">Charité</option>
                                    <option value="schuld">Schuld</option>
                                    <!-- Weitere Optionen werden später dynamisch gefüllt -->
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Sync-Shift (ms)</label>
                                <input type="number" class="form-control" name="sync_offset" value="0" step="50">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Deutsche .srt Datei</label>
                                <input class="form-control" type="file" name="file" id="fileInput" accept=".srt" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="uploadBtn">Übersetzung starten</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- HAUPTANSICHT (Fortschritt & Live-Logs) -->
            <div class="col-md-8">
                <div class="card shadow-sm" id="activeJobCard" style="display: none;">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0" id="jobTitle">Aktuelle Übersetzung...</h5>
                            <div>
                                <button class="btn btn-warning btn-sm" id="pauseBtn">⏸️ Pause</button>
                                <button class="btn btn-success btn-sm" id="resumeBtn" style="display: none;">▶️ Fortsetzen</button>
                            </div>
                        </div>
                        
                        <div class="mb-2 d-flex justify-content-between">
                            <span id="statusBadge" class="badge bg-primary">Laufend</span>
                            <span id="progressText">0 / 0 Zeilen</span>
                        </div>
                        <div class="progress mb-4" style="height: 25px;">
                            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;"></div>
                        </div>

                        <h6>Live-Logbuch</h6>
                        <pre id="logContainer" class="bg-dark text-light p-3 rounded" style="height: 300px; overflow-y: auto; font-size: 0.9em;"></pre>
                    </div>
                </div>
                
                <!-- Hinweis, wenn nichts aktiv ist -->
                <div id="emptyState" class="text-center text-muted mt-5">
                    <p>Lade links eine Datei hoch, um zu beginnen.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
