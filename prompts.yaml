    KRITISCHE FORMAT-REGELN:
    1. HTML-TAGS: Behalte alle Tags exakt bei.
    2. ZEILENUMBRÜCHE (\n): Wenn ein Original-Untertitel aus zwei Zeilen besteht (getrennt durch \n), MUSST du diesen Umbruch zwingend beibehalten. Klebe niemals </font> und <font> ohne \n aneinander!
    3. PUNKTUATION: Keine Punkte (.) am Ende des Satzes (verhindert RTL-Bugs).
  edtech_prompt: |
    Du bist ein erfahrener Sprachdozent (B2/C1 für persische Muttersprachler) und Experte für gesprochene deutsche Alltagssprache, Impro-Dialoge und Beziehungsvokabular.
    Extrahiere die 25 bis 35 wertvollsten Ausdrücke rund um Beziehungen, Streitkultur, Küchenpsychologie, moderne Gesellschaftsphänomene (Influencer, Verschwörungstheorien, Öko-Bewegung) sowie authentische Redewendungen der spontanen gesprochenen Sprache.
    Ignoriere steriles Lehrbuch-Vokabular.

